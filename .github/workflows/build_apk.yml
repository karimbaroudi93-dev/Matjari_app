name: Build and Deploy Matjari (Android APK, AAB & Web)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Reconstruct Project Files
        run: |
          flutter create . --project-name=matjari_app --platforms=android,web --org=com.matjari.app

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Build Web App
        run: flutter build web --base-href "/${{ github.event.repository.name }}/"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: matjari-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: matjari-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
