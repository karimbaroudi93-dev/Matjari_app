import 'package:flutter/material.dart';

void main() {
  runApp(const MatjariApp());
}

class Product {
  final String id;
  final String name;
  final String store;
  final double price;
  final String category;
  final String imageUrl;

  Product({
    required this.id,
    required this.name,
    required this.store,
    required this.price,
    required this.category,
    required this.imageUrl,
  });
}

class CartItem {
  final Product product;
  int quantity;

  CartItem({required this.product, this.quantity = 1});
}

class MatjariApp extends StatelessWidget {
  const MatjariApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'متجري | Matjari',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(
        primarySwatch: Colors.deepPurple,
        scaffoldBackgroundColor: const Color(0xFFF6F6F6),
        fontFamily: 'Roboto',
      ),
      home: const MainHomeScreen(),
    );
  }
}

class MainHomeScreen extends StatefulWidget {
  const MainHomeScreen({super.key});

  @override
  State<MainHomeScreen> createState() => _MainHomeScreenState();
}

class _MainHomeScreenState extends State<MainHomeScreen> {
  int _currentIndex = 0;
  String _selectedCategory = 'الكل';
  String _searchQuery = '';

  final List<CartItem> _cart = [];

  final List<Product> _products = [
    Product(
      id: '1',
      name: 'وجبة برغر عائلية',
      store: 'Crunchyz Burgers',
      price: 15.0,
      category: 'طعام',
      imageUrl: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500',
    ),
    Product(
      id: '2',
      name: 'قميص رجالي عصري',
      store: 'متجر الأناقة',
      price: 25.0,
      category: 'ألبسة',
      imageUrl: 'https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=500',
    ),
    Product(
      id: '3',
      name: 'هاتف ذكي جديد',
      store: 'تكنو ستور',
      price: 300.0,
      category: 'إلكترونيات',
      imageUrl: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500',
    ),
    Product(
      id: '4',
      name: 'بيتزا إيطالية ممتازة',
      store: 'Crunchyz Burgers',
      price: 12.0,
      category: 'طعام',
      imageUrl: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500',
    ),
    Product(
      id: '5',
      name: 'سماعات لاسلكية',
      store: 'تكنو ستور',
      price: 45.0,
      category: 'إلكترونيات',
      imageUrl: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500',
    ),
  ];

  void _addToCart(Product product) {
    setState(() {
      final index = _cart.indexWhere((item) => item.product.id == product.id);
      if (index >= 0) {
        _cart[index].quantity++;
      } else {
        _cart.add(CartItem(product: product));
      }
    });
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(
        content: Text('تمت إضافة ${product.name} إلى السلة'),
        duration: const Duration(seconds: 1),
      ),
    );
  }

  void _addNewProduct(Product newProduct) {
    setState(() {
      _products.add(newProduct);
    });
  }

  @override
  Widget build(BuildContext context) {
    final pages = [
      _buildShoppingTab(),
      _buildMerchantTab(),
      _buildCartTab(),
    ];

    return Scaffold(
      appBar: AppBar(
        title: const Text('متجري | Matjari', style: TextStyle(fontWeight: FontWeight.bold)),
        centerTitle: true,
        backgroundColor: Colors.deepPurple,
        foregroundColor: Colors.white,
        actions: [
          Stack(
            alignment: Alignment.center,
            children: [
              IconButton(
                icon: const Icon(Icons.shopping_cart),
                onPressed: () {
                  setState(() => _currentIndex = 2);
                },
              ),
              if (_cart.isNotEmpty)
                Positioned(
                  top: 8,
                  right: 8,
                  child: CircleAvatar(
                    radius: 8,
                    backgroundColor: Colors.red,
                    child: Text(
                      '${_cart.length}',
                      style: const TextStyle(fontSize: 10, color: Colors.white),
                    ),
                  ),
                )
            ],
          )
        ],
      ),
      body: pages[_currentIndex],
      bottomNavigationBar: BottomNavigationBar(
        currentIndex: _currentIndex,
        onTap: (index) => setState(() => _currentIndex = index),
        selectedItemColor: Colors.deepPurple,
        items: const [
          BottomNavigationBarItem(icon: Icon(Icons.store), label: 'التسوق'),
          BottomNavigationBarItem(icon: Icon(Icons.dashboard), label: 'لوحة التاجر'),
          BottomNavigationBarItem(icon: Icon(Icons.shopping_cart_checkout), label: 'السلة'),
        ],
      ),
    );
  }

  Widget _buildShoppingTab() {
    final filtered = _products.where((p) {
      final matchesCategory = _selectedCategory == 'الكل' || p.category == _selectedCategory;
      final matchesSearch = p.name.contains(_searchQuery) || p.store.contains(_searchQuery);
      return matchesCategory && matchesSearch;
    }).toList();

    return Column(
      children: [
        Padding(
          padding: const EdgeInsets.all(12.0),
          child: TextField(
            onChanged: (val) => setState(() => _searchQuery = val),
            decoration: InputDecoration(
              hintText: 'ابحث عن منتج أو متجر...',
              prefixIcon: const Icon(Icons.search),
              filled: true,
              fillColor: Colors.white,
              border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
            ),
          ),
        ),
        SizedBox(
          height: 45,
          child: ListView(
            scrollDirection: Axis.horizontal,
            padding: const EdgeInsets.symmetric(horizontal: 8),
            children: ['الكل', 'طعام', 'ألبسة', 'إلكترونيات'].map((cat) {
              final isSelected = _selectedCategory == cat;
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 4),
                child: ChoiceChip(
                  label: Text(cat),
                  selected: isSelected,
                  selectedColor: Colors.deepPurple.shade100,
                  onSelected: (_) => setState(() => _selectedCategory = cat),
                ),
              );
            }).toList(),
          ),
        ),
        const SizedBox(height: 10),
        Expanded(
          child: GridView.builder(
            padding: const EdgeInsets.all(12),
            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
              crossAxisCount: 2,
              childAspectRatio: 0.72,
              crossAxisSpacing: 10,
              mainAxisSpacing: 10,
            ),
            itemCount: filtered.length,
            itemBuilder: (context, i) {
              final p = filtered[i];
              return Card(
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                clipBehavior: Clip.antiAlias,
                elevation: 2,
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Expanded(
                      child: Image.network(
                        p.imageUrl,
                        width: double.infinity,
                        fit: BoxFit.cover,
                        errorBuilder: (_, __, ___) => Container(
                          color: Colors.grey.shade300,
                          child: const Icon(Icons.image_not_supported, size: 50),
                        ),
                      ),
                    ),
                    Padding(
                      padding: const EdgeInsets.all(8.0),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(p.name, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                          Text(p.store, style: const TextStyle(color: Colors.grey, fontSize: 11)),
                          const SizedBox(height: 4),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text('${p.price.toStringAsFixed(0)}\$', style: const TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                              IconButton(
                                icon: const Icon(Icons.add_shopping_cart, color: Colors.deepPurple, size: 20),
                                onPressed: () => _addToCart(p),
                              )
                            ],
                          )
                        ],
                      ),
                    )
                  ],
                ),
              );
            },
          ),
        )
      ],
    );
  }

  Widget _buildMerchantTab() {
    final nameCtrl = TextEditingController();
    final storeCtrl = TextEditingController();
    final priceCtrl = TextEditingController();
    final imageCtrl = TextEditingController();
    String category = 'طعام';

    return SingleChildScrollView(
      padding: const EdgeInsets.all(16.0),
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          const Text('إضافة منتج جديد للمتجر', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
          const SizedBox(height: 15),
          TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'اسم المنتج', border: OutlineInputBorder())),
          const SizedBox(height: 10),
          TextField(controller: storeCtrl, decoration: const InputDecoration(labelText: 'اسم المتجر', border: OutlineInputBorder())),
          const SizedBox(height: 10),
          TextField(controller: priceCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'السعر (\$)', border: OutlineInputBorder())),
          const SizedBox(height: 10),
          TextField(controller: imageCtrl, decoration: const InputDecoration(labelText: 'رابط الصورة (URL)', border: OutlineInputBorder())),
          const SizedBox(height: 15),
          StatefulBuilder(
            builder: (context, setDropdownState) => DropdownButtonFormField<String>(
              value: category,
              items: ['طعام', 'ألبسة', 'إلكترونيات']
                  .map((c) => DropdownMenuItem(value: c, child: Text(c)))
                  .toList(),
              onChanged: (v) => setDropdownState(() => category = v!),
              decoration: const InputDecoration(labelText: 'القسم', border: OutlineInputBorder()),
            ),
          ),
          const SizedBox(height: 20),
          SizedBox(
            width: double.infinity,
            height: 50,
            child: ElevatedButton(
              style: ElevatedButton.styleFrom(backgroundColor: Colors.deepPurple, foregroundColor: Colors.white),
              onPressed: () {
                if (nameCtrl.text.isNotEmpty && priceCtrl.text.isNotEmpty) {
                  _addNewProduct(
                    Product(
                      id: DateTime.now().toString(),
                      name: nameCtrl.text,
                      store: storeCtrl.text.isEmpty ? 'متجري' : storeCtrl.text,
                      price: double.tryParse(priceCtrl.text) ?? 10.0,
                      category: category,
                      imageUrl: imageCtrl.text.isNotEmpty ? imageCtrl.text : 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500',
                    ),
                  );
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم إضافة المنتج بنجاح!')));
                  setState(() => _currentIndex = 0);
                }
              },
              child: const Text('نشر المنتج', style: TextStyle(fontSize: 16)),
            ),
          )
        ],
      ),
    );
  }

  Widget _buildCartTab() {
    final double total = _cart.fold(0, (sum, item) => sum + (item.product.price * item.quantity));

    if (_cart.isEmpty) {
      return const Center(child: Text('السلة فارغة حالياً', style: TextStyle(fontSize: 16, color: Colors.grey)));
    }

    return Column(
      children: [
        Expanded(
          child: ListView.builder(
            itemCount: _cart.length,
            itemBuilder: (context, i) {
              final item = _cart[i];
              return ListTile(
                leading: Image.network(item.product.imageUrl, width: 50, height: 50, fit: BoxFit.cover),
                title: Text(item.product.name),
                subtitle: Text('${item.product.price}\$ × ${item.quantity} = ${(item.product.price * item.quantity).toStringAsFixed(0)}\$'),
                trailing: Row(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    IconButton(
                      icon: const Icon(Icons.remove_circle_outline),
                      onPressed: () {
                        setState(() {
                          if (item.quantity > 1) {
                            item.quantity--;
                          } else {
                            _cart.removeAt(i);
                          }
                        });
                      },
                    ),
                    Text('${item.quantity}'),
                    IconButton(
                      icon: const Icon(Icons.add_circle_outline),
                      onPressed: () {
                        setState(() {
                          item.quantity++;
                        });
                      },
                    ),
                  ],
                ),
              );
            },
          ),
        ),
        Container(
          padding: const EdgeInsets.all(16),
          color: Colors.white,
          child: Row(
            mainAxisAlignment: MainAxisAlignment.spaceBetween,
            children: [
              Text('المجموع: ${total.toStringAsFixed(0)}\$', style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green)),
              ElevatedButton(
                style: ElevatedButton.styleFrom(backgroundColor: Colors.deepPurple, foregroundColor: Colors.white),
                onPressed: () {
                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم إرسال الطلب بنجاح!')));
                  setState(() => _cart.clear());
                },
                child: const Text('إتمام الشراء'),
              )
            ],
          ),
        )
      ],
    );
  }
}
